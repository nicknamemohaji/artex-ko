services:
  egress-proxy:
    # Pinned to the linux/amd64 manifest for mitmproxy 11.0.2. Re-resolve the
    # digest deliberately when upgrading; a floating tag defeats review.
    image: mitmproxy/mitmproxy@sha256:836cc23dd3dd1bfc1a8ca199df7a4c39ba136cb08a7c58b8f633149a80caa183
    command:
      - sh
      - /opt/artex/start-proxy.sh
    environment:
      ARTEX_EGRESS_LOG_DIR: /var/log/artex-egress
      ARTEX_EGRESS_BODY_LIMIT: ${ARTEX_EGRESS_BODY_LIMIT:-0}
      ARTEX_EGRESS_SSE_BODY_LIMIT: ${ARTEX_EGRESS_SSE_BODY_LIMIT:-4194304}
      ARTEX_EGRESS_SSE_EVENT_LIMIT: ${ARTEX_EGRESS_SSE_EVENT_LIMIT:-65536}
      ARTEX_EGRESS_LOG_BYTES: ${ARTEX_EGRESS_LOG_BYTES:-52428800}
      ARTEX_EGRESS_LOG_BACKUPS: ${ARTEX_EGRESS_LOG_BACKUPS:-10}
    volumes:
      - ./ops/egress-proxy/addon.py:/opt/artex/addon.py:ro
      - ./ops/egress-proxy/start-proxy.sh:/opt/artex/start-proxy.sh:ro
      - ./data/egress-proxy/logs:/var/log/artex-egress
      - egress_proxy_ca:/home/mitmproxy/.mitmproxy
      - egress_proxy_public_ca:/shared-ca
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared-ca/ready && test -s /shared-ca/mitmproxy-ca-cert.pem"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      # Diagnostic access only. ARTEX reaches it on the private Compose network.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: artex-ko:${ARTEX_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.ko
      args:
        ARTEX_BUILD_VERSION: ${ARTEX_BUILD_VERSION:-dev}
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      # The LLM transport intentionally ignores HTTP_PROXY. Set its explicit
      # proxy default here; an explicit .env value can disable/replace it.
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-http://egress-proxy:8080}
      ARTEX_MCP_PROXY: ${ARTEX_MCP_PROXY:-http://egress-proxy:8080}
      ARTEX_EGRESS_CA: /etc/artex-egress-ca/mitmproxy-ca-cert.pem
      NODE_EXTRA_CA_CERTS: /etc/artex-egress-ca/mitmproxy-ca-cert.pem
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 데이터 디렉터리(jwt.key, SQLite 등 포함)를 프로젝트 루트의 data/ 에 바인드합니다.
      # 호스트에서 바로 확인·백업할 수 있고, 컨테이너를 다시 만들어도 사라지지 않습니다.
      - ./data:/app/data
      # 프로젝트 루트의 skills 를 컨테이너에 마운트합니다(이미지에 내장된 /app/skills 를 덮어씁니다).
      # skill 을 고치면 이미지를 다시 빌드할 필요 없이, 컨테이너가 호스트의 이 파일을 그대로 읽습니다.
      - ./skills:/app/skills
      # Public certificate only. The proxy private CA key stays in its own volume.
      - egress_proxy_public_ca:/etc/artex-egress-ca:ro
    restart: unless-stopped

volumes:
  pgdata:
  egress_proxy_ca:
  egress_proxy_public_ca:
